name: Deploy Edge Functions (Production)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'apps/web/supabase/functions/**'
      - 'apps/web/supabase/config.toml'
      - '.github/workflows/deploy-edge-functions-production.yml'
  workflow_dispatch:

jobs:
  deploy-production:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Verify Edge Functions exist
        run: |
          if [ ! -d "apps/web/supabase/functions" ]; then
            echo "❌ Error: Edge Functions directory not found"
            exit 1
          fi

          echo "📦 Found Edge Functions:"
          ls -la apps/web/supabase/functions/

      - name: Deploy Edge Functions to Production
        working-directory: apps/web
        run: |
          echo "🚀 Deploying Edge Functions to production environment..."

          # config.toml 기반으로 모든 함수 배포
          supabase functions deploy \
            --project-ref $SUPABASE_PROJECT_ID \
            --debug

      - name: Set Edge Function Secrets (Production)
        working-directory: apps/web
        run: |
          echo "🔐 Setting Edge Function secrets for production..."

          # NEXT_PUBLIC_APP_URL 설정 (production 앱 URL)
          supabase secrets set \
            NEXT_PUBLIC_APP_URL="${{ secrets.PRODUCTION_APP_URL }}" \
            --project-ref $SUPABASE_PROJECT_ID

          # INTERNAL_API_SECRET 설정
          supabase secrets set \
            INTERNAL_API_SECRET="${{ secrets.PRODUCTION_INTERNAL_API_SECRET }}" \
            --project-ref $SUPABASE_PROJECT_ID

          echo "✅ Secrets configured for production"

      - name: Test Edge Function Deployment
        run: |
          echo "🧪 Testing Edge Function deployment..."

          # 함수 목록 확인
          supabase functions list --project-ref $SUPABASE_PROJECT_ID

          echo "✅ Deployment verified"

      - name: Notify Deployment Success
        run: |
          echo "## 🎉 Edge Functions Deployed (Production)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Environment:" >> $GITHUB_STEP_SUMMARY
          echo "- 🌍 **Production**" >> $GITHUB_STEP_SUMMARY
          echo "- 📦 Project: \`$SUPABASE_PROJECT_ID\`" >> $GITHUB_STEP_SUMMARY
          echo "- 🌿 Branch: \`main\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployed Functions:" >> $GITHUB_STEP_SUMMARY
          echo "- \`process-source-job-queue\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚠️ Important:" >> $GITHUB_STEP_SUMMARY
          echo "- Production deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor for any errors in Supabase dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- Test critical functionality" >> $GITHUB_STEP_SUMMARY
