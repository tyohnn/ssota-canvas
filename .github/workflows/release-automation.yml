name: Release Automation

on:
  # 옵션 1: 수동 트리거 (GitHub UI에서 실행)
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.5.3, v0.6.0)'
        required: true
        type: string

  # 옵션 2: PR Label 기반 자동화
  pull_request:
    branches: [main]
    types: [closed]

jobs:
  # PR Label 기반 버전 계산
  calculate-version:
    if: |
      github.event_name == 'pull_request' &&
      github.event.pull_request.merged == true &&
      (
        contains(github.event.pull_request.labels.*.name, 'release:major') ||
        contains(github.event.pull_request.labels.*.name, 'release:minor') ||
        contains(github.event.pull_request.labels.*.name, 'release:patch')
      )
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate new version
        id: version
        run: |
          # 최신 태그 가져오기
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.5.2")
          echo "Latest tag: $LATEST_TAG"

          # 버전 파싱 (v0.5.2 -> 0 5 2)
          VERSION=${LATEST_TAG#v}
          IFS='.' read -r -a VERSION_PARTS <<< "$VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-5}
          PATCH=${VERSION_PARTS[2]:-2}

          # Label에 따라 버전 증가
          if [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:major') }}" == "true" ]]; then
            MAJOR=$((MAJOR + 1))
            MINOR=0
            PATCH=0
          elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'release:minor') }}" == "true" ]]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

  # 수동 트리거 또는 자동 트리거 후 실행
  create-release:
    if: |
      github.event_name == 'workflow_dispatch' ||
      needs.calculate-version.outputs.new_version != ''
    needs: [calculate-version]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set version variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ needs.calculate-version.outputs.new_version }}" >> $GITHUB_OUTPUT
          fi

      - name: Configure git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Create and push tag
        run: |
          VERSION="${{ steps.vars.outputs.version }}"

          # CHANGELOG에서 최신 변경사항 추출
          RELEASE_NOTES=$(awk '/^## \[unreleased\]/,/^## \[/ {print}' CHANGELOG.md | head -n -1)

          # 태그 생성
          git tag -a "$VERSION" -m "Release $VERSION

          $RELEASE_NOTES"

          echo "✅ Created tag: $VERSION"

          # 태그 push (이게 release.yml 트리거함)
          git push origin "$VERSION"
          echo "✅ Pushed tag: $VERSION"
          echo "🚀 GitHub Release will be created automatically by release.yml"

      - name: Summary
        run: |
          echo "## 🎉 Release Automation Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Created:" >> $GITHUB_STEP_SUMMARY
          echo "- 🏷️ Tag: \`${{ steps.vars.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ GitHub Release will be created automatically" >> $GITHUB_STEP_SUMMARY
          echo "2. ✅ CHANGELOG is already updated" >> $GITHUB_STEP_SUMMARY
          echo "3. 📝 Create next sprint branch manually when ready:" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "   git checkout dev" >> $GITHUB_STEP_SUMMARY
          echo "   git checkout -b sprint/v0.5.4-sprint-018" >> $GITHUB_STEP_SUMMARY
          echo "   \`\`\`" >> $GITHUB_STEP_SUMMARY
