name: Canary Release

on:
  # dev 브랜치에 merge될 때마다 canary 릴리스 생성
  pull_request:
    branches: [dev]
    types: [opened, synchronize, closed]

  # 또는 수동 트리거
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number (optional, auto-incremented if not provided)'
        required: false
        type: string

jobs:
  canary-release:
    # github-actions bot PR은 스킵 (기본 조건만 체크)
    # skip-canary 라벨은 첫 step에서 API로 확인 (더 확실함)
    if: |
      github.event_name == 'workflow_dispatch' || 
      (github.event.pull_request.merged == true &&
      github.event.pull_request.user.login != 'github-actions[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check skip-canary label
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "✅ Manual trigger - proceeding"
            echo "proceed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # PR 번호 확인
          PR_NUMBER="${{ github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "⚠️ No PR number found"
            echo "proceed=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "🔍 Checking PR #$PR_NUMBER for skip-canary label..."

          # Method 1: GitHub event context에서 라벨 가져오기 (가장 직접적)
          echo "🔎 Method 1: From github.event.pull_request.labels..."
          EVENT_LABELS='${{ toJSON(github.event.pull_request.labels) }}'
          echo "📦 Event labels JSON:"
          echo "$EVENT_LABELS"

          LABELS=$(echo "$EVENT_LABELS" | jq -r '.[].name' 2>/dev/null | tr '\n' ',' || echo "")
          echo "📋 Parsed from event: [$LABELS]"

          # Method 2: GitHub REST API (fallback, GITHUB_TOKEN 사용)
          if [ -z "$LABELS" ]; then
            echo "🔎 Method 2: Fetching via REST API with GITHUB_TOKEN..."
            API_RESPONSE=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")
            
            echo "📦 API response status:"
            HTTP_STATUS=$(echo "$API_RESPONSE" | jq -r '.message // "success"')
            echo "Status: $HTTP_STATUS"
            
            if [ "$HTTP_STATUS" != "success" ]; then
              echo "📦 Full API response:"
              echo "$API_RESPONSE" | jq -c '.'
            fi
            
            echo "📦 Labels from API:"
            echo "$API_RESPONSE" | jq -c '.labels // []'
            
            LABELS=$(echo "$API_RESPONSE" | jq -r '.labels[]?.name // empty' 2>/dev/null | tr '\n' ',' || echo "")
            echo "📋 Parsed from API: [$LABELS]"
          fi

          # skip-canary 라벨이 있는지 확인
          if [ -n "$LABELS" ] && echo "$LABELS" | grep -qiE "skip-canary|no-release"; then
            echo "⏭️ SKIPPING: Found skip-canary label"
            echo "proceed=false" >> $GITHUB_OUTPUT
            
            # Summary 출력
            echo "## ⏭️ Canary Release Skipped" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Reason:** PR #$PR_NUMBER has \`skip-canary\` label" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Labels found:** \`$LABELS\`" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi

          if [ -z "$LABELS" ]; then
            echo "⚠️ No labels found (might be expected for some PRs)"
          fi

          echo "✅ No skip label found - proceeding with canary release"
          echo "proceed=true" >> $GITHUB_OUTPUT

      - name: Checkout repository
        if: steps.check.outputs.proceed == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: dev
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-tags: true # 원격 태그도 가져오기

      - name: Configure git
        if: steps.check.outputs.proceed == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      - name: Calculate canary version
        if: steps.check.outputs.proceed == 'true'
        id: version
        run: |
          # 원격 태그 정보 가져오기
          git fetch --tags --force

          # 날짜 기반 버전 (YYYY.MM.DD-canary.BUILD)
          DATE=$(date +%Y.%m.%d)

          # 빌드 번호 계산
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.build_number }}" ]; then
            BUILD_NUMBER="${{ inputs.build_number }}"
          else
            # 오늘 날짜의 canary 태그 개수 세기 (원격 포함)
            TODAY_TAGS=$(git tag -l "v${DATE}-canary.*" | wc -l | tr -d ' ')
            BUILD_NUMBER=$((TODAY_TAGS + 1))
          fi

          # 3자리로 포맷팅 (001, 002, ...)
          BUILD_NUMBER=$(printf "%03d" $BUILD_NUMBER)

          CANARY_VERSION="${DATE}-canary.${BUILD_NUMBER}"

          echo "canary_version=$CANARY_VERSION" >> $GITHUB_OUTPUT
          echo "date=$DATE" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

          echo "📦 Canary version: $CANARY_VERSION"
          echo "📊 Today's canary tags: $TODAY_TAGS"

      - name: Generate release notes
        if: steps.check.outputs.proceed == 'true'
        id: notes
        run: |
          # 최신 태그 이후의 커밋들 추출
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          if [ -z "$LATEST_TAG" ]; then
            # 태그가 없으면 모든 커밋
            COMMITS=$(git log --oneline --no-merges -10)
          else
            # 최신 태그 이후 커밋
            COMMITS=$(git log ${LATEST_TAG}..HEAD --oneline --no-merges -10)
          fi

          # Release notes 생성 (YAML 문법 오류 방지)
          cat > RELEASE_NOTES.md << EOF
          ## 🐤 Canary Release: ${{ steps.version.outputs.canary_version }}

          This is a pre-release build for testing purposes.

          ### Recent Changes
          $(echo "$COMMITS" | sed 's/^/- /')

          ### ⚠️ Warning
          This is a canary release. It may contain bugs or incomplete features.
          Use at your own risk.

          ### 📝 How to Test
          1. Install this canary version
          2. Test new features
          3. Report any issues on GitHub Issues
          4. Provide feedback if possible

          ---
          *This release was automatically generated from the \`dev\` branch.*
          EOF

          echo "✅ Generated release notes"

      - name: Create and push tag
        if: steps.check.outputs.proceed == 'true'
        run: |
          VERSION="${{ steps.version.outputs.canary_version }}"
          TAG_NAME="v${VERSION}"

          # 태그가 이미 존재하는지 확인
          if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "⚠️ Tag $TAG_NAME already exists. Skipping tag creation."
            echo "ℹ️ This can happen if the workflow runs multiple times for the same commit."
            echo "✅ Tag already exists, proceeding to release creation..."
            exit 0
          fi

          # 태그 메시지 파일로 생성
          cat > TAG_MESSAGE.txt << 'TAGEOF'
          Canary release ${{ steps.version.outputs.canary_version }}

          Pre-release build for testing.
          Generated automatically from dev branch.
          TAGEOF

          # 태그 생성
          git tag -a "$TAG_NAME" -F TAG_MESSAGE.txt
          rm -f TAG_MESSAGE.txt

          echo "✅ Created tag: $TAG_NAME"

          # 태그 push
          git push origin "$TAG_NAME"
          echo "✅ Pushed tag: $TAG_NAME"

      - name: Publish GitHub Release
        if: steps.check.outputs.proceed == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: 'v${{ steps.version.outputs.canary_version }}'
          name: '${{ steps.version.outputs.canary_version }}'
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: true # ⭐ Pre-release로 표시
          make_latest: false # 최신 릴리스로 설정하지 않음
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: steps.check.outputs.proceed == 'true'
        run: |
          echo "## 🐤 Canary Release Created!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Version:" >> $GITHUB_STEP_SUMMARY
          echo "- \`v${{ steps.version.outputs.canary_version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details:" >> $GITHUB_STEP_SUMMARY
          echo "- Date: ${{ steps.version.outputs.date }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ steps.version.outputs.build_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: dev" >> $GITHUB_STEP_SUMMARY
          echo "- Pre-release: ✅ Yes" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps:" >> $GITHUB_STEP_SUMMARY
          echo "1. ✅ Canary release published" >> $GITHUB_STEP_SUMMARY
          echo "2. 📝 Testers can now install and test" >> $GITHUB_STEP_SUMMARY
          echo "3. 🐛 Report issues if found" >> $GITHUB_STEP_SUMMARY
