name: Generate CHANGELOG

on:
  # main 브랜치에만 직접 push 허용 (release용)
  push:
    branches: [main]

  # PR이 merge될 때 changelog 생성
  pull_request:
    branches: [main, dev]
    types: [closed]

jobs:
  changelog:
    # PR이 merge되었을 때만 실행
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        run: |
          wget -q https://github.com/orhun/git-cliff/releases/download/v2.10.1/git-cliff-2.10.1-x86_64-unknown-linux-musl.tar.gz
          tar -xzf git-cliff-2.10.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x git-cliff-2.10.1/git-cliff
          sudo mv git-cliff-2.10.1/git-cliff /usr/local/bin/

      - name: Generate CHANGELOG
        id: git-cliff
        run: |
          echo "🔍 Generating CHANGELOG..."
          git cliff --config cliff.toml --unreleased --strip header > CHANGELOG_NEW.md
          if ! cmp -s CHANGELOG.md CHANGELOG_NEW.md 2>/dev/null; then
            echo "✅ CHANGELOG has changes"
            mv CHANGELOG_NEW.md CHANGELOG.md
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "ℹ️ No changes in CHANGELOG"
            rm -f CHANGELOG_NEW.md
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit CHANGELOG changes
        if: steps.git-cliff.outputs.has_changes == 'true'
        run: |
          echo "💾 Committing CHANGELOG changes..."
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add CHANGELOG.md
          git commit -m "docs: update CHANGELOG

          Automatic CHANGELOG update from commit messages.

          - Technical Implementation: Generated using git-cliff
          - Design Decisions: Based on conventional commit format
          - Alternatives: Manual updates considered but chose automation

          Impact: Ensures consistent and accurate project documentation."
          echo "✅ CHANGELOG commit created"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes
        if: steps.git-cliff.outputs.has_changes == 'true'
        run: |
          # PR merge인 경우 base 브랜치로 push, 일반 push인 경우 현재 브랜치로 push
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            TARGET_BRANCH="${{ github.event.pull_request.base.ref }}"
            echo "🚀 Pushing CHANGELOG to base branch: $TARGET_BRANCH..."
            git push origin HEAD:$TARGET_BRANCH
          else
            echo "🚀 Pushing CHANGELOG to ${{ github.ref_name }}..."
            git push origin ${{ github.ref_name }}
          fi
          echo "✅ Changes pushed successfully"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Log skip reason
        if: steps.git-cliff.outputs.has_changes != 'true'
        run: |
          echo "⏭️ Skipping CHANGELOG commit - no changes detected"
          echo "Change detection result: '${{ steps.git-cliff.outputs.has_changes }}'"
          echo "This usually means:"
          echo "  - No new conventional commits since last tag/release"
          echo "  - Generated CHANGELOG content is identical to existing file"
          echo "  - Commits don't match any configured commit_parsers patterns"

      - name: Log success
        if: steps.git-cliff.outputs.has_changes == 'true'
        run: |
          echo "✅ CHANGELOG successfully updated and pushed!"
          echo "Event: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "PR: ${{ github.event.pull_request.title }}"
            echo "Base branch: ${{ github.event.pull_request.base.ref }}"
          fi
